[project]
name = "gaussian-processes"
version = "0.1.0"
description = "Educational implementation of Gaussian process regression in Python"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "qpsolvers[osqp]>=4.13.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
# Optional residual-RL experiment (examples/train_residual_rl.py).
# Not installed by default: `uv sync --group rl`, run via
# `uv run --group rl python examples/train_residual_rl.py`.
rl = [
    "gymnasium>=1.0",
    "stable-baselines3>=2.6",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "W",  # pycodestyle warnings
    "I",  # import sorting
]

[tool.pytest.ini_options]
testpaths = ["tests"]
